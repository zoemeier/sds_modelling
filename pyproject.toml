[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sds-source-detection"
version = "0.1.0"
description = "Shared code for identifying sand and dust storm source regions (backtracking + ML)"
requires-python = ">=3.10"
# dependencies are managed by environment.yaml (conda), not by pip

[tool.setuptools.packages.find]
where = ["src"]
