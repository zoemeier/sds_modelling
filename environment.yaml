# Conda environment for the whole pipeline (download -> plotting).
#   conda env create -f environment.yaml
#   conda activate sds
#   pip install -e .
# Versions are the ones the paper's model was trained with. train_nn.py also
# needs PyTorch, which is deliberately not included here (see README).
name: sds
channels:
  - conda-forge
dependencies:
  - python=3.11
  # core
  - numpy=2.4
  - pandas=3.0
  - xarray=2026.2
  - scipy=1.17
  - dask
  - bottleneck    # xarray interpolate_na / ffill (NDVI preprocessing)
  - tqdm
  - psutil
  # file formats
  - netcdf4
  - h5netcdf
  - pytables      # pandas HDF5 (step 1 tracks / features)
  - cfgrib        # ERA5 GRIB files
  # download + preprocessing
  - requests
  - cdsapi
  - owslib
  - rioxarray
  - xesmf
  # model + analysis
  - scikit-learn=1.8
  - joblib
  - optuna=4.8
  - shap=0.51
  # plotting
  - matplotlib=3.10
  - cartopy=0.25
  - seaborn
  - pillow
  - ffmpeg        # outcome animation (analyze_rf_results.py)
  - pip
